[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hades"
description = "Hades V2 — quantitative research system for Pump.fun tokens on Solana (paper trading only)"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    # Used by scripts/probe_pumpportal_ws.py. Pure Python with an optional C
    # extension it falls back from, so it is safe on the Bobcat (see D8).
    "websockets>=14",
]

[tool.setuptools.dynamic]
version = { attr = "hades.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "T20"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["N", "T20"]
"tests/*" = ["T20"]
# The probe scripts are terminal tools; printing a report is what they are for.
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    # Starlette's TestClient deprecates the httpx 0.x backend and asks for
    # httpx2. Test-harness only; it never runs in the container. Allow-listed
    # narrowly so every *other* warning stays a hard failure.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
addopts = "-q"
