[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
file_template = %%(rev)s_%%(slug)s

# sqlalchemy.url is deliberately NOT set here. The DSN comes from DATABASE_URL
# via hades.config.settings, so there is exactly one source of truth for it and
# no credential can be committed to the repository by accident.

# Logging is configured by hades.observability.logging in migrations/env.py.
# No [loggers]/[handlers]/[formatters] sections: alembic's fileConfig would
# tear down the structlog handlers and produce a second log format on stdout.
