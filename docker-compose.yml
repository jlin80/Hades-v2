# Three services, and no more. No Redis, no Kafka, no message bus: Hades V1's
# stall was a Redis Stream consumer falling behind a firehose, and V2 does not
# get to inherit that shape until a measured bottleneck demands it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hades}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-hades}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hades} -d ${POSTGRES_DB:-hades}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # One-shot: brings the schema to head before the API can start. Gated by
  # service_completed_successfully so `docker compose up -d` is turnkey.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Measures the API process itself, not its dependencies: a degraded
      # database must show up in the /health payload, not as a dead container.
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',
          timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
